<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta
      name="description"
      content="PulseFit is a smart fitness tracker designed to help you monitor your heart rate, sleep, and daily activity."
    />

    <!-- Social Sharing -->
    <meta property="og:title" content="PulseFit | Smart Fitness Tracker" />
    <meta
      property="og:description"
      content="Track your heart rate, sleep, and daily activity with PulseFit."
    />
    <meta property="og:type" content="website" />

    <!-- Page Title -->
    <title>PulseFit | Smart Fitness Tracker</title>

    <!-- Stylesheet -->
     <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ==================== Header ==================== -->
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a href="#hero" class="logo">
          <span class="logo-icon" aria-hidden="true">♥</span>
          <span class="logo-text">PulseFit</span>
        </a>

        <ul class="nav-links">
          <li>
            <a href="#features">Features</a>
          </li>

          <li>
            <a href="#about">About</a>
          </li>

          <li>
            <a href="#pricing">Pricing</a>
          </li>

          <li>
            <a href="#contact">Contact</a>
          </li>
        </ul>

        <a href="#pricing" class="nav-cta"> Pre-Order </a>
      </nav>
    </header>

    <!-- ==================== Main Content ==================== -->
    <main>
      <!-- ==================== Hero Section ==================== -->
      <section id="hero" class="hero">
        <div class="hero-content">
          <div class="hero-feature hero-feature-left">
            <span class="feature-icon">♡</span>

            <div>
              <h3>Real-Time Health</h3>
              <p>24/7 biometric data</p>
            </div>
          </div>

          <div class="hero-feature hero-feature-right">
            <span class="feature-icon">◔</span>

            <div>
              <h3>Smart Sleep</h3>
              <p>Stage analysis</p>
            </div>
          </div>

          <div class="watch-container">
            <div class="watch-glow"></div>

            <img
              src="assets/plusefit-Hero.png"
              alt="PulseFit smartwatch"
              class="hero-watch"
            />
          </div>

          <div class="hero-feature hero-feature-bottom">
            <span class="feature-icon">⌁</span>

            <div>
              <h3>Activity Insights</h3>
              <p>100+ workout types</p>
            </div>
          </div>

          <div class="hero-text mt-5">
            <h1>
              Your Health,
              <span>Perfected.</span>
            </h1>

            <p>Precision biometrics. Intelligent coaching. All day.</p>

            <div class="hero-buttons">
              <a href="#pricing" class="hero-btn primary"> Pre-Order Now </a>

              <a href="#features" class="hero-btn secondary">
                Explore Features
              </a>
            </div>
          </div>
        </div>
      </section>

      <!-- ==================== Features Section ==================== -->
      <section id="features"></section>

      <!-- ==================== About Section ==================== -->
      <section id="about"></section>

      <!-- ==================== Pricing Section ==================== -->
      <section id="pricing"></section>

      <!-- ==================== Contact Section ==================== -->
      <section id="contact"></section>
    </main>

    <!-- ==================== Footer ==================== -->
    <footer></footer>

    <!-- JavaScript -->
     <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
